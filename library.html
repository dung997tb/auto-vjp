<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Kho dữ liệu cào — Auto vjp</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 14px; color: #1c1e21; background: linear-gradient(135deg, #eef2ff, #e8f5e9); min-height: 100vh; }
  header { display: flex; align-items: center; gap: 12px; padding: 12px 18px; background: rgba(122, 33, 162, 0.94); color: #fff; position: sticky; top: 0; z-index: 5; }
  header h1 { font-size: 17px; margin: 0; flex: 1; }
  header button, header select { padding: 5px 10px; border-radius: 8px; border: 1px solid rgba(255,255,255,.4); background: rgba(255,255,255,.14); color: #fff; cursor: pointer; font-size: 13px; }
  header select option { color: #1c1e21; }
  main { display: flex; gap: 14px; padding: 14px 18px; align-items: flex-start; }
  .pane { background: rgba(255,255,255,.82); border-radius: 14px; padding: 12px; box-shadow: 0 2px 10px rgba(31,38,135,.08); }
  #datasetsPane { width: 36%; max-height: calc(100vh - 90px); overflow: auto; position: sticky; top: 76px; }
  #postsPane { flex: 1; min-width: 0; }
  h2 { font-size: 14px; margin: 4px 0 8px; color: #6a1b9a; }
  .hint { color: #65676b; font-size: 12px; margin: 4px 0; }
  .ds { border: 1px solid #e0e2e8; border-radius: 10px; padding: 8px; margin-bottom: 8px; background: #fff; }
  .ds.active { border-color: #7b1fa2; box-shadow: 0 0 0 2px rgba(123,31,162,.18); }
  .ds b { font-size: 13px; }
  .ds .meta { color: #65676b; font-size: 11px; margin: 3px 0; }
  .ds .row { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 5px; }
  .ds button, #libFilters button, #postsPane button { font-size: 11.5px; padding: 3px 8px; border-radius: 6px; border: 1px solid #d0d3da; background: #f4f5f7; cursor: pointer; }
  .ds button.danger { background: #ffebe6; color: #c0392b; border-color: #f5c6c6; }
  .ds button.primary { background: #e7f3ff; color: #0866ff; border-color: #cfe3ff; }
  #libFilters { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; padding: 8px; background: rgba(255,255,255,.82); border-radius: 12px; margin-bottom: 8px; }
  #libFilters label { display: flex; align-items: center; gap: 4px; font-size: 12px; }
  #libSearch { flex: 1; min-width: 160px; padding: 6px 8px; border-radius: 8px; border: 1px solid #d0d3da; }
  #libSelectBar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; padding: 8px; background: rgba(255,255,255,.82); border-radius: 12px; margin-bottom: 10px; }
  #libSelectBar button, #libSelectBar span { font-size: 11.5px; }
  #libSelectBar button { padding: 3px 8px; border-radius: 6px; border: 1px solid #d0d3da; background: #f4f5f7; cursor: pointer; }
  #libSelectBar button.primary { background: #e7f3ff; color: #0866ff; border-color: #cfe3ff; }
  #libSelectCount { color: #6a1b9a; font-weight: 600; margin-right: auto; }
  .post { border: 1px solid #e0e2e8; border-radius: 10px; padding: 9px; margin-bottom: 8px; background: #fff; cursor: pointer; }
  .post.selected { border-color: #0866ff; box-shadow: 0 0 0 2px rgba(8,102,255,.15); background: #f5f9ff; }
  .post .head { display: flex; align-items: center; gap: 7px; flex-wrap: wrap; font-size: 12px; color: #65676b; }
  .post .selChk { margin-right: 2px; cursor: pointer; }
  .badge { font-size: 10.5px; padding: 1px 7px; border-radius: 10px; color: #fff; }
  .badge.text { background: #1877f2; } .badge.textBg { background: #b45309; } .badge.photo { background: #0b7a35; } .badge.video { background: #b91c1c; } .badge.other { background: #607d8b; }
  .post .text { white-space: pre-wrap; margin: 6px 0; font-size: 13px; }
  .post .media { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
  .post .media img { width: 110px; height: 82px; object-fit: cover; border-radius: 8px; border: 1px solid #e0e2e8; }
  .post.detail { cursor: default; border-color: #7b1fa2; }
  .post .actions { display: flex; gap: 6px; margin-top: 6px; }
  #libMedia { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 8px; }
  .mediaItem { border: 1px solid #e0e2e8; border-radius: 10px; padding: 6px; background: #fff; font-size: 11px; }
  .mediaItem img { width: 100%; height: 92px; object-fit: cover; border-radius: 8px; }
  .status { color: #7b1fa2; font-size: 12px; margin: 6px 0; }
  .err { color: #c0392b; }
  a { color: #0866ff; }
</style>
</head>
<body>
<header>
  <h1 data-i18n="lib.title">📚 Kho dữ liệu đã cào</h1>
  <span id="libStorage" style="font-size:12px;opacity:.9"></span>
  <button id="libRefreshBtn" data-i18n="lib.refresh">🔄 Tải lại</button>
  <select id="libFormat" aria-label="Download format" title="Định dạng tải về">
    <option value="md">MD</option>
    <option value="json">JSON</option>
    <option value="txt">TXT</option>
  </select>
  <select id="libLang" aria-label="Language">
    <option value="vi">Tiếng Việt</option>
    <option value="en">English</option>
  </select>
</header>
<main>
  <section id="datasetsPane" class="pane">
    <h2 data-i18n="lib.sources">Nguồn dữ liệu</h2>
    <div id="libImportWrap" style="margin-bottom:10px;border:1px dashed #c9ccd6;border-radius:10px;padding:8px">
      <div class="hint" data-i18n="lib.importHint">Nhập lại file JSON đã xuất (hoặc JSONL mỗi dòng 1 bài) để xem/dùng trên máy khác.</div>
      <input type="file" id="libImportFile" accept=".json,.jsonl,.txt" style="max-width:100%;font-size:12px">
      <button id="libImportBtn" data-i18n="lib.importBtn">⬆ Nhập</button>
      <div id="libImportStatus" class="hint"></div>
    </div>
    <div id="libDatasets"></div>
  </section>
  <section id="postsPane" class="pane">
    <div id="libFilters">
      <input id="libSearch" placeholder="Tìm trong bài..." data-i18n-ph="lib.searchPh">
      <label><input type="checkbox" id="libFText" checked> <span data-i18n="lib.fText">Text</span></label>
      <label><input type="checkbox" id="libFTextBg" checked> <span data-i18n="lib.fTextBg">Nền màu</span></label>
      <label><input type="checkbox" id="libFPhoto" checked> <span data-i18n="lib.fPhoto">Ảnh</span></label>
      <label><input type="checkbox" id="libFVideo" checked> <span data-i18n="lib.fVideo">Video</span></label>
    </div>
    <div id="libSelectBar">
      <span id="libSelectCount" class="hint" data-i18n="lib.selectNone">Chưa chọn bài nào — đang dùng toàn bộ bài theo bộ lọc.</span>
      <button id="libSelectAllBtn" data-i18n="lib.selectAll">☑ Chọn tất cả (theo bộ lọc)</button>
      <button id="libSelectClearBtn" data-i18n="lib.selectClear">✕ Bỏ chọn</button>
      <button id="libBuildProfileBtn" class="primary" data-i18n="lib.buildProfile">✨ Tạo hồ sơ văn phong</button>
      <button id="libExportBtn" data-i18n="lib.exportBtn">⬇ Xuất dữ liệu</button>
    </div>
    <div id="libProfileStatus" class="status"></div>
    <div id="libPosts"></div>
    <h2 id="libMediaTitle" data-i18n="lib.mediaTitle">🖼 Media đã lưu của nguồn này</h2>
    <div id="libMediaActions" class="row" style="display:flex;gap:6px;margin-bottom:8px">
      <button id="libDeleteMediaBtn" class="danger" data-i18n="lib.deleteMedia">🗑 Xóa toàn bộ media</button>
    </div>
    <div id="libMedia"></div>
  </section>
</main>
<script src="i18n.js"></script>
<script src="scrapeStore.js"></script>
<script src="library.js"></script>
</body>
</html>
